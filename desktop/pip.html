<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <title>후원 · 멀티뷰 후원</title>
    <style>
      /* 투네이션 디자인 토큰 (src/ui/app.css와 같은 값) */
      :root { --primary: #519cff; --ink: #212529; --ink-sub: #464c54; --line: #dee5ec; --surface: #edf1f6; --live: #f84949; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #fff; font-family: 'Pretendard', 'Malgun Gothic', system-ui, sans-serif; }
      header {
        height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 12px;
        border-bottom: 1px solid var(--line); background: #fff; color: var(--ink);
        -webkit-app-region: drag; user-select: none;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex: none; }
      #title { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tag { flex: none; height: 18px; padding: 0 6px; border-radius: 4px; background: var(--surface); color: var(--ink-sub); font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; }
      button {
        -webkit-app-region: no-drag; height: 26px; border: 0; border-radius: 999px; padding: 0 10px;
        font: inherit; font-size: 12px; font-weight: 600; background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer;
      }
      button:hover { background: #f4f7fa; }
      #amounts { display: flex; gap: 4px; flex: none; }
      #amounts button { padding: 0 8px; color: var(--primary); }
      #messages { -webkit-app-region: no-drag; flex: none; max-width: 92px; height: 26px; border: 0; border-radius: 999px; padding: 0 6px; font: inherit; font-size: 12px; background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
      #messages[hidden] { display: none; }
      #close { width: 26px; padding: 0; box-shadow: none; color: var(--ink-sub); font-size: 14px; }
      #close:hover { background: var(--live); color: #fff; }
    </style>
  </head>
  <body>
    <header>
      <span class="dot"></span>
      <span id="title"></span>
      <span class="tag">PIP</span>
      <span id="amounts"></span>
      <select id="messages" aria-label="자주 쓰는 메시지" title="자주 쓰는 메시지 채우기" hidden></select>
      <button id="modal" title="앱 화면 가운데 모달로 보기">모달로</button>
      <button id="close" title="후원창 닫기" aria-label="후원창 닫기">✕</button>
    </header>
    <script>
      const titleEl = document.getElementById('title');
      const setTitle = (t) => {
        titleEl.textContent = String(t || '').replace(/ · 멀티뷰 후원$/, '');
        document.title = t || '';
      };
      setTitle(new URLSearchParams(location.search).get('title'));
      window.mvPip.onTitle(setTitle);
      // 빠른 후원 금액: 누르면 후원 페이지의 금액 칸만 채운다 (후원 버튼은 직접)
      const amountsEl = document.getElementById('amounts');
      const setAmounts = (list) => {
        amountsEl.replaceChildren(
          ...list.filter((n) => Number.isInteger(n) && n > 0).map((n) => {
            const b = document.createElement('button');
            b.textContent = n.toLocaleString('ko-KR');
            b.title = `${b.textContent}원 채우기`;
            b.addEventListener('click', () => window.mvPip.fill(n));
            return b;
          }),
        );
      };
      setAmounts((new URLSearchParams(location.search).get('amounts') || '').split(',').filter(Boolean).map(Number));
      window.mvPip.onAmounts(setAmounts);
      // 자주 쓰는 후원 메시지: 고르면 후원 페이지의 메시지 칸만 채운다
      const messagesEl = document.getElementById('messages');
      const setMessages = (list) => {
        const head = document.createElement('option');
        head.value = '';
        head.textContent = '메시지';
        messagesEl.replaceChildren(
          head,
          ...list.filter((m) => typeof m === 'string' && m.trim()).map((m) => {
            const o = document.createElement('option');
            o.value = m;
            o.textContent = m.length > 20 ? `${m.slice(0, 20)}…` : m;
            return o;
          }),
        );
        messagesEl.hidden = messagesEl.options.length <= 1;
      };
      messagesEl.addEventListener('change', () => {
        if (messagesEl.value) window.mvPip.fillMessage(messagesEl.value);
        messagesEl.value = '';
      });
      try {
        setMessages(JSON.parse(new URLSearchParams(location.search).get('messages') || '[]'));
      } catch {
        setMessages([]);
      }
      window.mvPip.onMessages(setMessages);
      document.getElementById('modal').addEventListener('click', () => window.mvPip.toModal());
      document.getElementById('close').addEventListener('click', () => window.mvPip.close());
    </script>
  </body>
</html>
